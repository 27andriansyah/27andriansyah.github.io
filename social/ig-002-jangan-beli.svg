<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#080a0f"/><text x="65" y="150" fill="#fff" font-family="Arial" font-size="68" font-weight="800">JANGAN BELI HP</text><text x="65" y="235" fill="#f4c542" font-family="Arial" font-size="90" font-weight="900">SEBELUM CEK 3 HAL</text><rect x="65" y="330" width="950" height="150" rx="28" fill="#171d28"/><text x="105" y="395" fill="#f4c542" font-family="Arial" font-size="34" font-weight="700">01 • SPESIFIKASI</text><text x="105" y="445" fill="#fff" font-family="Arial" font-size="28">Harus sesuai kebutuhan, bukan sekadar angka besar.</text><rect x="65" y="510" width="950" height="150" rx="28" fill="#171d28"/><text x="105" y="575" fill="#f4c542" font-family="Arial" font-size="34" font-weight="700">02 • GARANSI</text><text x="105" y="625" fill="#fff" font-family="Arial" font-size="28">Pastikan jelas siapa yang bertanggung jawab.</text><rect x="65" y="690" width="950" height="150" rx="28" fill="#171d28"/><text x="105" y="755" fill="#f4c542" font-family="Arial" font-size="34" font-weight="700">03 • HARGA</text><text x="105" y="805" fill="#fff" font-family="Arial" font-size="28">Bandingkan total manfaat, bukan harga saja.</text><text x="65" y="925" fill="#fff" font-family="Arial" font-size="32">Follow untuk tips belanja yang bikin kamu lebih yakin.</text></svg>