<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"><rect width="1080" height="1080" fill="#0a0d13"/><text x="70" y="155" fill="#f4c542" font-family="Arial" font-size="78" font-weight="900">KAMU PILIH YANG MANA?</text><text x="70" y="245" fill="#fff" font-family="Arial" font-size="40">HP A: kamera lebih bagus</text><text x="70" y="315" fill="#fff" font-family="Arial" font-size="40">HP B: performa lebih kencang</text><rect x="70" y="390" width="420" height="270" rx="30" fill="#151d2b" stroke="#f4c542" stroke-width="4"/><text x="280" y="500" text-anchor="middle" fill="#f4c542" font-family="Arial" font-size="72" font-weight="900">A</text><text x="280" y="570" text-anchor="middle" fill="#fff" font-family="Arial" font-size="32">KAMERA</text><rect x="590" y="390" width="420" height="270" rx="30" fill="#151d2b" stroke="#f4c542" stroke-width="4"/><text x="800" y="500" text-anchor="middle" fill="#f4c542" font-family="Arial" font-size="72" font-weight="900">B</text><text x="800" y="570" text-anchor="middle" fill="#fff" font-family="Arial" font-size="32">PERFORMA</text><text x="70" y="790" fill="#fff" font-family="Arial" font-size="38">Komentar A atau B 👇</text><text x="70" y="870" fill="#f4c542" font-family="Arial" font-size="34" font-weight="800">Follow — besok kita bahas mana yang lebih worth it.</text></svg>