<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07865f"><title>27 Mart — Sayuran Segar</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="global-polish.css"><style>
body{margin:0;background:linear-gradient(135deg,#eafff6,#f7fffb 48%,#eaf5ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#10251d}.veg{min-height:100vh}.vtop{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid #dceee7}.vw{width:min(1180px,94%);margin:auto}.vhead{min-height:68px;display:flex;align-items:center;gap:14px}.vbrand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#102743;min-width:205px}.vmark{width:42px;height:42px;border:4px solid #0aa05d;border-radius:12px;display:grid;place-items:center;color:#087f5b;font-weight:1000}.vbrand b{font-size:22px}.vbrand small{display:block;font-size:9px;color:#07865f;font-weight:900}.vsearch{flex:1;height:44px;border:1px solid #cfe1db;background:#fff;border-radius:16px;display:flex;align-items:center;padding:0 14px;box-shadow:0 6px 18px rgba(10,80,55,.06)}.vsearch input{border:0;outline:0;width:100%;font-size:13px;margin-left:8px}.vback{padding:10px 14px;border-radius:12px;background:#07865f;color:#fff;text-decoration:none;font-size:11px;font-weight:950}.vhero{margin:18px 0 14px;border-radius:28px;overflow:hidden;padding:34px 28px;background:linear-gradient(110deg,rgba(0,126,72,.96),rgba(18,181,108,.78),rgba(30,125,206,.55)),url('https://images.pexels.com/photos/1656663/pexels-photo-1656663.jpeg?auto=compress&dpr=1&w=1600') center/cover;color:#fff;box-shadow:0 15px 40px rgba(8,127,91,.18)}.vhero h1{font-size:clamp(36px,6vw,64px);line-height:.9;margin:0 0 12px;font-weight:1000;letter-spacing:-3px;text-transform:uppercase}.vhero p{max-width:700px;margin:0;font-weight:750;line-height:1.5}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid #d6e6df;background:#fff;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:950;color:#4d6158;cursor:pointer}.chip.active{background:#07865f;color:#fff;border-color:#07865f;box-shadow:0 8px 18px rgba(8,134,95,.18)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.count{font-size:12px;color:#65766f;font-weight:800;margin-right:auto}.sort{height:40px;border:1px solid #d5e4de;border-radius:12px;background:#fff;padding:0 10px;font-weight:850}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;padding-bottom:50px}.card{background:#fff;border:1px solid #dfebe6;border-radius:17px;padding:9px;box-shadow:0 7px 20px rgba(10,70,50,.06);min-width:0;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(10,70,50,.1)}.photo{height:150px;border-radius:12px;overflow:hidden;background:#f0f7f3;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:7px;top:7px;background:rgba(255,255,255,.92);color:#087f5b;border-radius:999px;padding:5px 7px;font-size:8px;font-weight:950}.card h3{font-size:12px;line-height:1.2;min-height:29px;margin:9px 2px 3px}.meta{font-size:9px;color:#74847e;margin:0 2px}.price{font-size:15px;font-weight:1000;color:#087f5b;margin:5px 2px}.buy{width:100%;border:0;border-radius:10px;padding:8px;background:linear-gradient(90deg,#078f58,#12bb70);color:#fff;font-weight:950;font-size:10px;cursor:pointer}.empty{background:#fff;border:1px dashed #c8dad2;border-radius:18px;padding:35px;text-align:center;color:#718079;grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(8,20,15,.66);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}.modal.show{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:26px;padding:20px}.sheettop{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.detail{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}.detail img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}.detail h2{margin:3px 0 7px;font-size:25px}.detail p{font-size:12px;color:#63736d;line-height:1.55}.detail-price{font-size:27px;color:#087f5b;font-weight:1000}.detail button{border:0;border-radius:13px;padding:11px 16px;background:#07865f;color:#fff;font-weight:950;cursor:pointer}.wa{display:block;text-align:center;margin-top:12px;text-decoration:none;background:#08744f;color:#fff;border-radius:13px;padding:12px;font-size:11px;font-weight:950}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.vhead{flex-wrap:wrap;padding:8px 0}.vbrand{min-width:auto}.vsearch{order:3;flex-basis:100%}.vback{margin-left:auto}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.photo{height:auto;aspect-ratio:1}.vhero{padding:27px 20px}.detail{grid-template-columns:1fr}.detail img{max-height:280px}.toolbar{align-items:flex-start}.sort{width:145px}}
</style></head><body class="veg"><header class="vtop"><div class="vw vhead"><a class="vbrand" href="index.html"><span class="vmark">27</span><span><b>27 Mart</b><small>SAYURAN SEGAR & KEBUTUHAN HARIAN</small></span></a><label class="vsearch">⌕<input id="q" placeholder="Cari sayuran, bumbu, jamur, paket..." aria-label="Cari sayuran"></label><a class="vback" href="toko.html">🛒 PPOB</a></div></header><main class="vw"><section class="vhero"><h1>Sayuran Segar</h1><p>Lengkap, mudah dicari, harga jual sudah mengikuti data katalog dan markup yang tercantum. Pilih produk untuk melihat detail lengkapnya.</p></section><div class="chips" id="chips"></div><div class="toolbar"><span class="count" id="count">Memuat katalog...</span><select class="sort" id="sort"><option value="default">Urutan katalog</option><option value="cheap">Harga termurah</option><option value="expensive">Harga termahal</option><option value="az">Nama A-Z</option></select></div><section class="grid" id="grid"></section></main><div class="modal" id="modal"><div class="sheet"><div class="sheettop"><b>Detail Produk</b><button class="close" onclick="closeDetail()">×</button></div><div id="detail"></div></div></div><script src="sayuran-data.js"></script><script>
const WA='62816951127';let active='Semua',term='',sort='default';const known={"Bawang Merah":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/BA17_99633200.jpg","Tomat Merah":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/TO16_106275397.jpg","Daun Bawang":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/DA16_106275413.jpg","Kentang Besar":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/KE18_93772403.jpg","Brokoli":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/BR12_144921081.jpg","Cabai Merah Keriting":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/CA25_66422159.jpg","Wortel Import":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/WO18_94247889.jpg","Kangkung":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/KA13_132844330.jpg","Wortel Reguler":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/WO19_88562843.jpg","Kacang Panjang":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/KA19_88562876.jpg","Bayam Hijau":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/BA16_106275482.jpg","Sawi Putih":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/SA15_113866562.jpg","Cabai Rawit Merah":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/CA22_75911031.jpg","Kol Gepeng":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/KO15_114443833.jpg","Buncis Reguler":"https://m-ubifresh.s3.amazonaws.com/productphoto/pimg/Sayuran/BU19_88562872.jpg"};
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');const photo=p=>known[p.nama]||`https://loremflickr.com/640/480/${encodeURIComponent(p.nama+' vegetable') }?lock=${p.no}`;function categories(){return ['Semua',...new Set(SAYURAN_CATALOG.map(p=>p.kategori))]}function filtered(){let a=SAYURAN_CATALOG.filter(p=>(active==='Semua'||p.kategori===active)&&(!term||`${p.nama} ${p.kategori} ${p.satuan}`.toLowerCase().includes(term)));if(sort==='cheap')a.sort((x,y)=>x.hargaJual-y.hargaJual);if(sort==='expensive')a.sort((x,y)=>y.hargaJual-x.hargaJual);if(sort==='az')a.sort((x,y)=>x.nama.localeCompare(y.nama,'id'));return a}function renderChips(){chips.innerHTML=categories().map(c=>`<button class="chip ${c===active?'active':''}" onclick="active='${esc(c)}';render()">${esc(c)}</button>`).join('')}function render(){renderChips();const a=filtered();count.textContent=`${a.length} produk dari 192 katalog`;grid.innerHTML=a.length?a.map(p=>`<article class="card"><div class="photo"><img src="${photo(p)}" alt="${esc(p.nama)}" loading="lazy" onerror="this.onerror=null;this.src='https://loremflickr.com/640/480/vegetable?lock=${p.no}'"><span class="badge">${esc(p.kategori)}</span></div><h3>${esc(p.nama)}</h3><p class="meta">${esc(p.satuan)} · stok saran ${p.stokHarian}</p><div class="price">${rp(p.hargaJual)}</div><button class="buy" onclick="openDetail(${p.no})">Lihat & Pesan</button></article>`).join(''):'<div class="empty">Produk tidak ditemukan.</div>'}function openDetail(no){const p=SAYURAN_CATALOG.find(x=>x.no===no);if(!p)return;const text=`Halo 27 Mart, saya ingin memesan ${p.nama} (${p.satuan}) dengan harga ${rp(p.hargaJual)}. No katalog: ${p.no}.`;detail.innerHTML=`<div class="detail"><img src="${photo(p)}" alt="${esc(p.nama)}"><div><small>${esc(p.kategori)} · No. ${p.no}</small><h2>${esc(p.nama)}</h2><p><b>Harga referensi:</b> ${rp(p.hargaReferensi)}<br><b>Harga jual:</b> ${rp(p.hargaJual)}<br><b>Satuan:</b> ${esc(p.satuan)}<br><b>Stok harian saran:</b> ${p.stokHarian}<br><b>Status harga:</b> ${esc(p.statusHarga)}<br><b>Tanggal:</b> ${esc(p.tanggal)}<br><b>Sumber:</b> ${esc(p.sumber)}</p><div class="detail-price">${rp(p.hargaJual)}</div><button onclick="location.href='https://wa.me/${WA}?text='+encodeURIComponent(${JSON.stringify(text)})">Pesan via WhatsApp</button></div></div>`;modal.classList.add('show')}function closeDetail(){modal.classList.remove('show')}q.oninput=e=>{term=e.target.value.toLowerCase().trim();render()};sortEl=sort;sort.onchange=e=>{sort=e.target.value;render()};document.addEventListener('DOMContentLoaded',render);</script></body></html>
