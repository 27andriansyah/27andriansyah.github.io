<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b"><meta name="description" content="Riwayat dan status pesanan 27 Mart."><title>Pesanan Saya — 27 Mart</title><link rel="stylesheet" href="style.css"><style>
.orders-main{padding:42px 0 70px}.orders-hero{padding:28px 30px;border-radius:24px;background:linear-gradient(120deg,#063f31,#087f5b);color:#fff;margin-bottom:18px}.orders-hero h1{margin:7px 0;font-size:34px;letter-spacing:-1.7px}.orders-hero p{margin:0;color:#d6eee5;font-size:11px;line-height:1.6}.orders-grid{display:grid;gap:13px}.order-history-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 26px rgba(22,50,40,.04)}.order-history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.order-history-head h2{margin:0;font-size:17px}.order-date{display:block;color:var(--muted);font-size:9px;margin-top:5px}.status-pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#fff3d6;color:#9b6d16;font-size:9px;font-weight:900;white-space:nowrap}.status-pill.verify{background:#e8f7f0;color:var(--green)}.status-pill.process{background:#eaf0ff;color:#4167a9}.status-pill.done{background:#e8f7f0;color:#16754f}.order-lines{margin:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.history-line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:10px}.history-line+ .history-line{border-top:1px dashed var(--line)}.history-line small{display:block;color:var(--muted);margin-top:3px}.history-total{display:flex;justify-content:space-between;align-items:center}.history-total span{font-size:10px;color:var(--muted)}.history-total strong{font-size:17px}.history-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.history-actions a,.history-actions button{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:11px;font-size:10px;font-weight:850}.history-actions .wa{background:var(--green);color:#fff;border-color:var(--green)}.empty-orders{text-align:center;background:#fff;border:1px dashed #cbd8d1;border-radius:20px;padding:48px 20px}.empty-orders span{font-size:42px}.empty-orders h2{margin:10px 0 5px}.empty-orders p{margin:0 0 18px;color:var(--muted);font-size:11px}.order-info{margin-top:13px;padding:10px 12px;background:#f6f9f7;border-radius:11px;color:var(--muted);font-size:9px;line-height:1.5}.back-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.back-row a{font-size:11px;font-weight:850;color:var(--green)}@media(max-width:650px){.orders-main{padding-top:22px}.orders-hero{padding:23px}.orders-hero h1{font-size:28px}.order-history-head{display:block}.status-pill{margin-top:10px}.history-total strong{font-size:15px}}
</style></head>
<body><header class="site-header"><div class="container header-top"><a class="brand" href="index.html#top"><span class="brand-mark">27</span><span><strong>27 Mart</strong><small>Belanja & Bayar</small></span></a><a class="back-link" href="index.html#produk">← Belanja</a></div></header>
<main class="orders-main container"><div class="orders-hero"><span class="eyebrow">AKUN · PESANAN</span><h1>Pesanan Saya 📦</h1><p>Lihat nomor pesanan dan status terakhir yang tersimpan di perangkat ini.</p></div><div class="back-row"><strong>Riwayat pesanan</strong><a href="index.html#produk">+ Buat pesanan baru</a></div><div id="ordersList" class="orders-grid"></div></main>
<footer><div class="container copyright">© 2026 27 Mart · <a href="index.html">Beranda</a></div></footer><script>
const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const names={1:['Bawang Merah',18000,'500 g'],2:['Tomat Merah',12000,'500 g'],3:['Kentang',16000,'1 kg'],4:['Cabai Merah',22000,'250 g'],5:['Beras Premium',78000,'5 kg'],6:['Minyak Goreng',19000,'1 L'],7:['Gula Pasir',18000,'1 kg'],8:['Tepung Terigu',14000,'1 kg'],9:['Pulsa Telkomsel',12000,'Rp10.000'],10:['Pulsa IM3',12000,'Rp10.000'],11:['Paket Data Telkomsel',15000,'5 GB'],12:['Paket Data XL',17000,'5 GB'],13:['Top Up DANA',22000,'Rp20.000'],14:['Top Up GoPay',22000,'Rp20.000'],15:['Top Up OVO',22000,'Rp20.000'],16:['Token PLN',52000,'Rp50.000'],17:['Tagihan PDAM',5000,'Admin'],18:['Tagihan BPJS',5000,'Admin']};
let orders=[];try{orders=JSON.parse(localStorage.getItem('27mart-orders')||'[]')}catch{}
const host=document.querySelector('#ordersList');
function statusClass(s){if(s==='Menunggu verifikasi')return 'verify';if(s==='Diproses')return 'process';if(s==='Selesai')return 'done';return ''}
function render(){if(!orders.length){host.innerHTML='<div class="empty-orders"><span>📦</span><h2>Belum ada pesanan</h2><p>Pesanan yang dibuat dari perangkat ini akan muncul di sini.</p><a class="primary" href="index.html#produk">Mulai Belanja →</a></div>';return}host.innerHTML=orders.map((o,i)=>{const lines=(o.cart||[]).map(r=>{const p=names[r.id]||['Produk',0,''];return `<div class="history-line"><div><strong>${esc(p[0])}</strong><small>${esc(p[2])} · x${r.qty}</small></div><b>${rupiah(p[1]*r.qty)}</b></div>`}).join('');const date=o.createdAt?new Date(o.createdAt).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';const msg=encodeURIComponent(`Halo 27 Mart 👋 Saya ingin menanyakan status pesanan ${o.orderId||'-'} atas nama ${o.name||'-'}.`);return `<article class="order-history-card"><div class="order-history-head"><div><h2>${esc(o.orderId||'Pesanan')}</h2><span class="order-date">${date}</span></div><span class="status-pill ${statusClass(o.status)}">${esc(o.status||'Menunggu pembayaran')}</span></div><div class="order-lines">${lines}</div><div class="history-total"><span>Total pesanan</span><strong>${rupiah(o.total)}</strong></div><div class="order-info">Nama: ${esc(o.name||'-')} · Metode: ${esc(o.payment||'-')}</div><div class="history-actions"><a href="payment.html" onclick="sessionStorage.setItem('27mart-order',JSON.stringify(${JSON.stringify(o).replace(/</g,'\\u003c')}))">Lihat pembayaran</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/62816951127?text=${msg}">Tanya via WhatsApp</a></div></article>`}).join('')}
render();
</script></body></html>
