<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b"><title>Admin — 27 Mart</title><link rel="stylesheet" href="style.css"><style>
.admin-main{padding:28px 0 70px}.admin-hero{background:linear-gradient(120deg,#063f31,#087f5b);color:#fff;border-radius:24px;padding:28px;margin-bottom:18px}.admin-hero h1{margin:7px 0;font-size:34px}.admin-hero p{margin:0;color:#d6eee5;font-size:11px}.admin-tools{display:flex;gap:9px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}.admin-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:9px}.admin-list{display:grid;gap:12px;margin-top:15px}.admin-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.admin-head{display:flex;justify-content:space-between;gap:12px}.admin-head h2{margin:0;font-size:16px}.admin-date{font-size:9px;color:var(--muted);margin-top:4px;display:block}.admin-status{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:10px;font-weight:800}.admin-lines{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:13px 0}.admin-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:10px}.admin-line+.admin-line{border-top:1px dashed var(--line)}.admin-meta{background:#f6f9f7;border-radius:12px;padding:11px;font-size:9px;line-height:1.65;color:#52665d}.admin-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.admin-actions button{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:10px;font-size:9px;font-weight:850}.admin-actions .save{background:var(--green);color:#fff;border-color:var(--green)}.empty-admin{background:#fff;border:1px dashed #cbd8d1;border-radius:18px;text-align:center;padding:45px 20px;color:var(--muted)}.danger{color:#a33b2b!important;border-color:#eccac2!important}@media(max-width:650px){.admin-stats{grid-template-columns:1fr}.admin-head{display:block}.admin-status{margin-top:9px;width:100%}}
</style></head>
<body><header class="site-header"><div class="container header-top"><a class="brand" href="index.html#top"><span class="brand-mark">27</span><span><strong>27 Mart</strong><small>Admin Dashboard</small></span></a><a class="back-link" href="index.html#produk">← Website</a></div></header>
<main class="admin-main container"><section class="admin-hero"><span class="eyebrow">INTERNAL · DASHBOARD</span><h1>Pesanan 27 Mart 🛠️</h1><p>Kelola status pesanan yang tersimpan di browser perangkat ini.</p></section><div class="admin-tools"><div class="admin-stats"><div class="stat"><b id="totalOrders">0</b><span>Total order</span></div><div class="stat"><b id="waitingOrders">0</b><span>Perlu ditindaklanjuti</span></div><div class="stat"><b id="salesTotal">Rp 0</b><span>Total nilai order</span></div></div><div><button id="exportOrders" class="primary" type="button">Export JSON</button> <button id="clearOrders" class="admin-actions danger" type="button">Hapus riwayat</button></div></div><div id="adminList" class="admin-list"></div></main><footer><div class="container copyright">© 2026 27 Mart · Dashboard</div></footer>
<script>
const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const names={1:['Bawang Merah',18000,'500 g'],2:['Tomat Merah',12000,'500 g'],3:['Kentang',16000,'1 kg'],4:['Cabai Merah',22000,'250 g'],5:['Beras Premium',78000,'5 kg'],6:['Minyak Goreng',19000,'1 L'],7:['Gula Pasir',18000,'1 kg'],8:['Tepung Terigu',14000,'1 kg'],9:['Pulsa Telkomsel',12000,'Rp10.000'],10:['Pulsa IM3',12000,'Rp10.000'],11:['Paket Data Telkomsel',15000,'5 GB'],12:['Paket Data XL',17000,'5 GB'],13:['Top Up DANA',22000,'Rp20.000'],14:['Top Up GoPay',22000,'Rp20.000'],15:['Top Up OVO',22000,'Rp20.000'],16:['Token PLN',52000,'Rp50.000'],17:['Tagihan PDAM',5000,'Admin'],18:['Tagihan BPJS',5000,'Admin']};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let orders=[];try{orders=JSON.parse(localStorage.getItem('27mart-orders')||'[]')}catch{}const host=document.querySelector('#adminList');function save(){localStorage.setItem('27mart-orders',JSON.stringify(orders));render()}function render(){const waiting=orders.filter(o=>o.status!=='Selesai').length;document.querySelector('#totalOrders').textContent=orders.length;document.querySelector('#waitingOrders').textContent=waiting;document.querySelector('#salesTotal').textContent=rupiah(orders.reduce((s,o)=>s+Number(o.total||0),0));if(!orders.length){host.innerHTML='<div class="empty-admin">📦<h2>Belum ada order</h2><p>Order dari browser ini akan muncul di sini.</p></div>';return}host.innerHTML=orders.map((o,i)=>{const lines=(o.cart||[]).map(r=>{const p=names[r.id]||['Produk',0,''];return `<div class="admin-line"><span><b>${esc(p[0])}</b><br>${esc(p[2])} · x${r.qty}</span><strong>${rupiah(p[1]*r.qty)}</strong></div>`}).join('');const date=o.createdAt?new Date(o.createdAt).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';return `<article class="admin-card"><div class="admin-head"><div><h2>${esc(o.orderId||'Pesanan')}</h2><span class="admin-date">${date}</span></div><select class="admin-status" data-status="${i}"><option ${o.status==='Menunggu pembayaran'?'selected':''}>Menunggu pembayaran</option><option ${o.status==='Menunggu verifikasi'?'selected':''}>Menunggu verifikasi</option><option ${o.status==='Diproses'?'selected':''}>Diproses</option><option ${o.status==='Selesai'?'selected':''}>Selesai</option><option ${o.status==='Dibatalkan'?'selected':''}>Dibatalkan</option></select></div><div class="admin-lines">${lines}</div><div class="admin-meta"><b>Pelanggan:</b> ${esc(o.name||'-')}<br><b>WhatsApp:</b> ${esc(o.phone||'-')}<br><b>Pembayaran:</b> ${esc(o.payment||'-')}<br>${o.address?`<b>Alamat:</b> ${esc(o.address)}<br>`:''}${o.target?`<b>Nomor/ID:</b> ${esc(o.target)}<br>`:''}${o.note?`<b>Catatan:</b> ${esc(o.note)}`:''}</div><div class="history-total" style="margin-top:12px"><span>Total</span><strong>${rupiah(o.total)}</strong></div><div class="admin-actions"><button class="save" data-save="${i}">Simpan status</button><a class="wa" target="_blank" rel="noopener" href="https://wa.me/62816951127?text=${encodeURIComponent(`Halo 27 Mart, pesanan ${o.orderId||'-'} atas nama ${o.name||'-'} saat ini berstatus ${o.status||'-'}.`)}">WhatsApp</a></div></article>`}).join('');host.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.save);orders[i].status=host.querySelector(`[data-status="${i}"]`).value;save()})}document.querySelector('#exportOrders').onclick=()=>{const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`27mart-orders-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clearOrders').onclick=()=>{if(confirm('Hapus semua riwayat order di browser ini?')){orders=[];save()}};render();
</script></body></html>
