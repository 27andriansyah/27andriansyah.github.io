<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087f5b"><title>Admin — 27 Mart</title><link rel="stylesheet" href="style.css"><style>.admin-main{padding:28px 0 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}.admin-hero{background:linear-gradient(120deg,#063f31,#087f5b);color:#fff;border-radius:24px;padding:28px;margin-bottom:16px}.admin-hero h1{margin:7px 0;font-size:32px}.admin-hero p{margin:0;color:#d6eee5;font-size:11px}.login{max-width:440px;margin:30px auto}.login label{display:block;font-size:11px;font-weight:800;margin:12px 0}.login input{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:22px}.stat span{font-size:9px;color:var(--muted)}.orders{display:grid;gap:12px}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:16px}.date{font-size:9px;color:var(--muted)}.status{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:10px;font-weight:800}.lines{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0}.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:10px}.line+.line{border-top:1px dashed var(--line)}.meta{background:#f6f9f7;border-radius:11px;padding:10px;font-size:9px;line-height:1.65;color:#52665d}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions button,.actions a{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:10px;font-size:9px;font-weight:850;text-decoration:none}.actions .save{background:var(--green);color:#fff;border-color:var(--green)}.error{color:#a33b2b;font-size:10px;margin-top:8px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}@media(max-width:650px){.stats{grid-template-columns:1fr}.head{display:block}.status{margin-top:8px;width:100%}}</style></head><body><header class="site-header"><div class="container header-top"><a class="brand" href="index.html#top"><span class="brand-mark">27</span><span><strong>27 Mart</strong><small>Admin Online</small></span></a><a class="back-link" href="index.html#produk">← Website</a></div></header><main class="admin-main container"><section class="admin-hero"><span class="eyebrow">ONLINE · REALTIME</span><h1>Dashboard 27 Mart 🛠️</h1><p>Kelola pesanan dari database online. Perubahan status tampil realtime.</p></section><section id="loginPanel" class="panel login"><h2>Login Admin</h2><p>Gunakan akun yang dibuat di Supabase Authentication.</p><label>Email<input id="email" type="email" autocomplete="username" placeholder="admin@email.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></label><button id="login" class="primary full" type="button">Masuk</button><div id="loginError" class="error"></div></section><section id="dashboard" hidden><div class="topbar"><strong id="who"></strong><button id="logout" class="secondary" type="button">Keluar</button></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total order</span></div><div class="stat"><b id="waiting">0</b><span>Belum selesai</span></div><div class="stat"><b id="sales">Rp 0</b><span>Total nilai order</span></div></div><div style="height:14px"></div><div id="orders" class="orders"></div></section></main><footer><div class="container copyright">© 2026 27 Mart · Dashboard Online</div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script>
const db=window.martDB,ordersHost=document.querySelector('#orders');let orders=[];const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadOrders(){const {data,error}=await db.from('orders').select('*,order_items(*)').order('created_at',{ascending:false});if(error){ordersHost.innerHTML=`<div class="panel error">Gagal memuat order: ${esc(error.message)}</div>`;return}orders=data||[];render()}
function render(){document.querySelector('#total').textContent=orders.length;document.querySelector('#waiting').textContent=orders.filter(o=>o.status!=='Selesai'&&o.status!=='Dibatalkan').length;document.querySelector('#sales').textContent=rupiah(orders.reduce((s,o)=>s+Number(o.total||0),0));if(!orders.length){ordersHost.innerHTML='<div class="panel">📦 Belum ada order online.</div>';return}ordersHost.innerHTML=orders.map(o=>{const items=(o.order_items||[]).map(i=>`<div class="line"><span><b>${esc(i.product_name)}</b><br>${esc(i.unit||'')} · x${i.qty}</span><strong>${rupiah(i.price*i.qty)}</strong></div>`).join('');const date=o.created_at?new Date(o.created_at).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'-';return `<article class="order"><div class="head"><div><h2>${esc(o.order_code)}</h2><span class="date">${date}</span></div><select class="status" data-status="${o.id}"><option ${o.status==='Menunggu pembayaran'?'selected':''}>Menunggu pembayaran</option><option ${o.status==='Menunggu verifikasi'?'selected':''}>Menunggu verifikasi</option><option ${o.status==='Diproses'?'selected':''}>Diproses</option><option ${o.status==='Selesai'?'selected':''}>Selesai</option><option ${o.status==='Dibatalkan'?'selected':''}>Dibatalkan</option></select></div><div class="lines">${items}</div><div class="meta"><b>Pelanggan:</b> ${esc(o.customer_name)}<br><b>WhatsApp:</b> ${esc(o.customer_phone)}<br><b>Pembayaran:</b> ${esc(o.payment_method)}<br>${o.target?`<b>Nomor/ID:</b> ${esc(o.target)}<br>`:''}${o.address?`<b>Alamat:</b> ${esc(o.address)}<br>`:''}${o.note?`<b>Catatan:</b> ${esc(o.note)}`:''}</div><div class="topbar" style="margin:12px 0 0"><strong>${rupiah(o.total)}</strong><div class="actions"><button class="save" data-save="${o.id}">Simpan status</button><a target="_blank" rel="noopener" href="https://wa.me/62816951127?text=${encodeURIComponent(`Halo ${o.customer_name}, pesanan ${o.order_code} saat ini berstatus ${o.status}.`)}">WhatsApp</a></div></div></article>`}).join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,select=document.querySelector(`[data-status="${id}"]`),status=select.value;const {error}=await db.from('orders').update({status}).eq('id',id);if(error)alert('Gagal mengubah status: '+error.message)})}
db.auth.onAuthStateChange((event,session)=>{if(session){document.querySelector('#loginPanel').hidden=true;document.querySelector('#dashboard').hidden=false;document.querySelector('#who').textContent='Admin: '+(session.user.email||'');loadOrders()}else{document.querySelector('#loginPanel').hidden=false;document.querySelector('#dashboard').hidden=true}});document.querySelector('#login').onclick=async()=>{const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;const {error}=await db.auth.signInWithPassword({email,password});document.querySelector('#loginError').textContent=error?error.message:''};document.querySelector('#logout').onclick=()=>db.auth.signOut();db.channel('orders-realtime').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe();
</script></body></html>
